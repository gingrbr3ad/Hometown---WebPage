<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmfinity Resort</title>

    <style>
        :root {
            --forest: #071d33;
            --forest-2: #123d5b;
            --coffee: #1e5f94;
            --coffee-2: #3a82c7;
            --ink: #102b42;
            --muted: #5b7893;
            --white: #ffffff;
            --line: #d7e2ee;
            --cream: #edf5fb;
            --gold: #9ccaf1;
            --shadow: 0 18px 45px rgba(7, 29, 51, 0.14);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        html,
        body {
            min-height: 100%;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background: var(--cream);
            color: var(--ink);
            line-height: 1.65;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 28px;
            min-height: 78px;
            padding: 0 32px;
            background: rgba(225, 230, 224, 0.9);
            border-bottom: 1px solid rgba(46, 68, 54, 0.10);
            box-shadow: 0 3px 12px rgba(46, 68, 54, 0.08);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
            text-decoration: none;
        }

        .nav-logo img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: var(--white);
        }

        .nav-logo span {
            color: var(--forest);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        nav a {
            position: relative;
            color: #3b4a3b;
            text-decoration: none;
            padding: 8px 0;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 2px;
            height: 2px;
            border-radius: 10px;
            background: var(--coffee-2);
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }

        nav a:hover {
            color: var(--coffee-2);
        }

        nav a:hover::after {
            transform: scaleX(1);
        }

        .hero-container {
            position: relative;
            isolation: isolate;
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 42px 24px 64px;
            color: var(--white);
            background:
                linear-gradient(90deg, rgba(7, 29, 51, 0.84), rgba(7, 29, 51, 0.32)),
                url("farmfinity.jpg") center / cover no-repeat;
            background-color: var(--forest);
        }

        .hero-container::after {
            content: "";
            position: absolute;
            width: 480px;
            height: 480px;
            right: -160px;
            top: -220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            z-index: -1;
        }

        .content-section {
            width: min(1180px, 100%);
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 48px;
        }

        .left-content {
            max-width: 620px;
        }

        .main-title {
            margin: 0 0 14px;
            font-size: clamp(42px, 6vw, 72px);
            line-height: 0.96;
            letter-spacing: -0.04em;
            text-transform: uppercase;
            text-shadow: 0 8px 26px rgba(0, 0, 0, 0.28);
        }

        .subtitle {
            margin: 0 0 18px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.9;
        }

        .description {
            max-width: 540px;
            margin: 0 0 26px;
            color: #efeadb;
            font-size: 16px;
        }

        .map-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--white);
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .map-link:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-2px);
        }

        .featured-card {
            justify-self: end;
            width: min(100%, 360px);
            height: 360px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 22px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .featured-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.55);
        }

        @media (max-width: 900px) {
            .content-section {
                grid-template-columns: 1fr;
            }

            .featured-card {
                justify-self: start;
                width: min(100%, 420px);
            }
        }
    </style>
</head>
<body>
    <nav>
        <a class="nav-logo" href="index.html" aria-label="Go to home page">
            <img src="logo.png" alt="Bontoc logo">
            <span>Bontoc</span>
        </a>
        <a href="index.html">Home</a>
    </nav>

    <div class="hero-container">
        <main class="content-section">
            <div class="left-content">
                <h1 class="main-title">FARMFINITY</h1>
                <p class="subtitle">EXPLORE SANTA CRUZ, BONTOC</p>
                <p class="description">
                    Discover <strong>Farmfinity Resort</strong>, an agritourism destination showcasing sustainable farming, organic produce, and family-friendly activities.
                </p>
                <a class="map-link" href="https://www.google.com/maps/search/Farmfinity+Resort,+Santa+Cruz,+Bontoc,+Southern+Leyte" target="_blank" rel="noreferrer">Open in Google Maps</a>
            </div>

            <div class="featured-card">
                <img src="farmfinity.jpg" alt="Farmfinity Resort">
            </div>
        </main>
    </div>
</body>
</html>
