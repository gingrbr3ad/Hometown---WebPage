<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bontoc Dike</title>

    <style>
        :root {
            --forest: #071d33;
            --forest-2: #123d5b;
            --coffee: #1e5f94;
            --coffee-2: #3a82c7;
            --ink: #102b42;
            --muted: #5b7893;
            --white: #ffffff;
            --line: #d7e2ee;
            --cream: #edf5fb;
            --gold: #9ccaf1;
            --shadow: 0 18px 45px rgba(7, 29, 51, 0.14);
            --radius: 22px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 0%, rgba(255, 255, 255, 0.95), transparent 34%),
                var(--cream);
            line-height: 1.65;
        }

        img {
            display: block;
            max-width: 100%;
        }

        a {
            color: inherit;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 28px;
            min-height: 78px;
            padding: 0 32px;
            background: #e1e6e0;
            border-bottom: 1px solid rgba(46, 68, 54, 0.10);
            box-shadow: 0 3px 12px rgba(46, 68, 54, 0.08);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: auto;
            text-decoration: none;
        }

        .nav-logo img {
            width: 46px;
            height: 46px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid var(--gold);
            background: var(--white);
        }

        .nav-logo span {
            color: var(--forest);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        nav a {
            position: relative;
            color: #3b4a3b;
            text-decoration: none;
            padding: 8px 0;
            font-size: 15px;
            font-weight: 700;
            transition: color 0.2s ease;
        }

        nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 2px;
            height: 2px;
            border-radius: 10px;
            background: var(--coffee-2);
            transform: scaleX(0);
            transition: transform 0.2s ease;
        }

        nav a:hover {
            color: var(--coffee-2);
        }

        nav a:hover::after {
            transform: scaleX(1);
        }

        .hero {
            position: relative;
            isolation: isolate;
            min-height: 560px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 42px 24px 64px;
            color: var(--white);
            background:
                linear-gradient(rgba(24, 40, 30, 0.78) 35%, rgba(24, 40, 30, 0.32) 100%),
                url("dike1.jpg") center / cover no-repeat;
            background-color: var(--forest);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 480px;
            height: 480px;
            right: -160px;
            top: -220px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            z-index: -1;
        }

        .hero-inner {
            width: min(1180px, 100%);
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            align-items: center;
            gap: 48px;
        }

        .hero-copy {
            max-width: 620px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            margin-bottom: 18px;
            border: 1px solid rgba(255, 255, 255, 0.30);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .hero-copy h1 {
            margin: 0 0 14px;
            font-size: clamp(42px, 6vw, 72px);
            line-height: 0.96;
            letter-spacing: -0.04em;
            text-transform: uppercase;
        }

        .hero-copy p {
            max-width: 540px;
            margin: 0 0 26px;
            color: #efeadb;
            font-size: 16px;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .hero-actions a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            padding: 0 20px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 800;
            font-size: 13px;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .hero-actions .primary {
            background: var(--white);
            color: var(--forest);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.14);
        }

        .hero-actions .primary:hover {
            background: #f3ecd8;
            transform: translateY(-2px);
        }

        .hero-feature {
            justify-self: end;
            width: min(100%, 360px);
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .hero-feature img {
            width: 100%;
            height: 360px;
            object-fit: cover;
            border-radius: 18px;
            border: 2px solid rgba(255, 255, 255, 0.55);
        }

        .gallery {
            max-width: 1180px;
            margin: 32px auto 48px;
            padding: 34px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(46, 68, 54, 0.07);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .gallery h2 {
            margin: 0 0 22px;
            color: var(--forest);
            font-size: clamp(25px, 3vw, 34px);
            letter-spacing: -0.02em;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .gallery-item {
            margin: 0;
            overflow: hidden;
            border-radius: 16px;
            background: var(--white);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.12);
        }

        .gallery-item img {
            width: 100%;
            height: 240px;
            object-fit: cover;
        }

        .gallery-item figcaption {
            padding: 10px 12px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--ink);
        }

        @media (max-width: 900px) {
            .hero-inner {
                grid-template-columns: 1fr;
            }

            .hero-feature {
                justify-self: start;
                width: min(100%, 420px);
            }
        }

        @media (max-width: 700px) {
            nav {
                padding: 0 18px;
            }

            .gallery {
                margin: 24px 14px 38px;
                padding: 22px 18px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a class="nav-logo" href="index.html" aria-label="Go to home page">
            <img src="logo.png" alt="Bontoc logo">
            <span>Bontoc</span>
        </a>
        <a href="index.html">Home</a>
    </nav>

    <header class="hero" aria-label="Bontoc Dike hero section">
        <div class="hero-inner">
            <div class="hero-copy">
                <span class="eyebrow">Riverside Escape</span>
                <h1>Bontoc Dike</h1>
                <p>
                    Enjoy a peaceful riverfront spot perfect for afternoon walks, jogging,
                    and quality time with friends beside the water.
                </p>
                <div class="hero-actions">
                    <a class="primary" href="https://www.google.com/maps/search/Bontoc+Dike,+Bontoc,+Southern+Leyte" target="_blank" rel="noreferrer">Open in Google Maps</a>
                </div>
            </div>

            <div class="hero-feature">
                <img src="dike1.jpg" alt="Main view of Bontoc Dike">
            </div>
        </div>
    </header>

    <section class="gallery" aria-labelledby="dike-gallery-title">
        <h2 id="dike-gallery-title">More Views of Bontoc Dike</h2>

        <div class="gallery-grid">
            <figure class="gallery-item">
                <img src="dike1.jpg" alt="Bontoc Dike, view 1" loading="lazy">
                <figcaption>Dike View 1</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="dike2.jpg" alt="Bontoc Dike, view 2" loading="lazy">
                <figcaption>Dike View 2</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="dike3.jpg" alt="Bontoc Dike, view 3" loading="lazy">
                <figcaption>Dike View 3</figcaption>
            </figure>
        </div>
    </section>
</body>
</html>
